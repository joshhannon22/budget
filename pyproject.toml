[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "budgeting"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
    "pyyaml>=6.0,<7",
]

[project.scripts]
budget = "budgeting.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
